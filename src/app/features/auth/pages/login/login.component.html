<div class="auth-card">
  <h1 class="auth-card__title">Iniciar sesión</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="correo@ejemplo.com"
      />
      <small class="error" *ngIf="email?.touched && email?.hasError('required')">
        El correo es obligatorio.
      </small>
      <small class="error" *ngIf="email?.touched && email?.hasError('email')">
        Ingresa un correo válido.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
      />
      <small class="error" *ngIf="password?.touched && password?.hasError('required')">
        La contraseña es obligatoria.
      </small>
      <small class="error" *ngIf="password?.touched && password?.hasError('minlength')">
        Debe tener al menos 6 caracteres.
      </small>
    </div>

    <small class="error error--general" *ngIf="errorMessage">{{ errorMessage }}</small>

    <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
      <span *ngIf="!isLoading">Ingresar</span>
      <span *ngIf="isLoading">Cargando...</span>
    </button>

    <p class="auth-form__link">
      ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a>
    </p>
  </form>
</div>
