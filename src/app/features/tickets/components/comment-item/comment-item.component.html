<div class="comment-item">
  <div class="comment-item__header">
    <span class="comment-item__author">{{ comment.author?.name ?? 'Usuario eliminado' }}</span>
    <span class="comment-item__role" *ngIf="comment.author?.role as role">{{ role }}</span>
    <span class="comment-item__date">{{ comment.createdAt | date: 'short' }}</span>
  </div>
  <p class="comment-item__content">{{ comment.body }}</p>
</div>
