<div class="profile">
  <h1 class="profile__title">Mi Perfil</h1>

  <app-spinner *ngIf="isLoading"></app-spinner>

  <small class="error" *ngIf="errorMessage && !isLoading">{{ errorMessage }}</small>

  <div class="profile__card" *ngIf="user && !isLoading">
    <div class="profile__avatar">{{ user.name.charAt(0).toUpperCase() }}</div>

    <div class="profile__info">
      <h2 class="profile__name">{{ user.name }}</h2>
      <app-role-badge [role]="user.role"></app-role-badge>
    </div>

    <div class="profile__details">
      <div class="detail-item">
        <span class="detail-item__label">Correo electrónico</span>
        <span class="detail-item__value">{{ user.email }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-item__label">Miembro desde</span>
        <span class="detail-item__value">{{ user.createdAt | date: 'longDate' }}</span>
      </div>
    </div>

    <p class="profile__note">
      La edición de perfil no está disponible actualmente. Contacta a un administrador si necesitas actualizar tus datos.
    </p>
  </div>
</div>
